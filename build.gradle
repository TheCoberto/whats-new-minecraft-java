plugins {
	id 'java'
}

group = 'com.thecoberto'
version = '1.0.0'

repositories {
	mavenCentral()
	maven { url = 'https://repo.papermc.io/repository/maven-public/' }
	// Floodgate, for Bedrock forms (optional at runtime)
	maven { url = 'https://repo.opencollab.dev/main/' }
}

dependencies {
	// Dialogs need Paper 1.21.7 or newer; built against the server's version.
	compileOnly 'io.papermc.paper:paper-api:26.3.build.262-stable'
	compileOnly 'org.geysermc.floodgate:api:2.2.5-SNAPSHOT'
}

java {
	// Paper 26.3 needs Java 25
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

processResources {
	inputs.property "version", project.version
	filesMatching("plugin.yml") {
		expand "version": project.version
	}
}
